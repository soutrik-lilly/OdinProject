<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title> Feature Card Grid</title>
</head>

<body>
    <header>
        <h1>Feature Card Grid</h1>
        <p>A simple grid layout of feature cards.</p>
    </header>
    <main>
        <div class="grid">
            <div class="card" id="card-featured">
                <h3>Streaming Responses</h3>
                <p>See tokens arrive in real time.</p>
            </div>
            <div class="card">
                <h3>Dark Mode</h3>
                <p>One class toggles the entire theme.</p>
            </div>
            <div class="card">
                <h3>Accessible by Default</h3>
                <p>Built on semantic HTML, not ARIA patches.</p>
            </div>
        </div>
    </main>

</body>


</html>
