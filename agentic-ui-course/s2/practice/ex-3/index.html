<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title> SaaS Pricing Table</title>
</head>

<body>
    <table>
        <caption>
            <h2>
                Pricing Plans
            </h2>
        </caption>
        <thead>
            <tr>
                <th scope="col">Plan</th>
                <th scope="col">Message</th>
                <th scope="col">Price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">Basic</th>
                <td>For individuals and small teams</td>
                <td>$10/month</td>
            </tr>
            <tr>
                <th scope="row">Pro</th>
                <td>For growing businesses and teams</td>
                <td>$30/month</td>
            </tr>
            <tr>
                <th scope="row">Enterprise</th>
                <td>For large organizations with advanced needs</td>
                <td>Contact us for pricing</td>
            </tr>
        </tbody>
    </table>

</body>

</html>
